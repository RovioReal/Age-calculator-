<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Glass macOS Simulation</title>
  <style>
    :root {
      --font-system: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 10px;
      --dur-fast: 140ms;
      --dur-med: 240ms;
      --dur-slow: 420ms;
      --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
      --blur-strength: 24px;
      --glow-strength: 0.33;
      --shadow-lg: 0 24px 48px rgba(0, 0, 0, 0.25), 0 3px 10px rgba(0, 0, 0, 0.2);
      --shadow-md: 0 12px 28px rgba(0, 0, 0, 0.18), 0 2px 8px rgba(0, 0, 0, 0.16);
      --shadow-sm: 0 4px 10px rgba(0, 0, 0, 0.2);

      --desktop-grad-a: #2b355f;
      --desktop-grad-b: #101527;
      --desktop-grad-c: #3d2069;

      --panel-bg: rgba(22, 25, 36, 0.55);
      --panel-bg-strong: rgba(20, 22, 32, 0.74);
      --panel-border: rgba(255, 255, 255, 0.17);
      --panel-highlight: rgba(255, 255, 255, 0.28);
      --text-main: #ecf2ff;
      --text-sub: #afbad4;
      --accent: #77a4ff;
      --accent-2: #8f82ff;
      --danger: #ff5f57;
      --warn: #febc2e;
      --ok: #28c840;
      --dock-bg: rgba(27, 31, 44, 0.58);
      --menu-bg: rgba(15, 18, 30, 0.63);
      --input-bg: rgba(255, 255, 255, 0.08);
      --input-border: rgba(255, 255, 255, 0.22);
      --selection: rgba(118, 168, 255, 0.35);
      --grid: rgba(255,255,255,0.04);
    }

    :root.light {
      --desktop-grad-a: #c2dbff;
      --desktop-grad-b: #edf3ff;
      --desktop-grad-c: #d9ceff;

      --panel-bg: rgba(255, 255, 255, 0.58);
      --panel-bg-strong: rgba(255, 255, 255, 0.77);
      --panel-border: rgba(255, 255, 255, 0.63);
      --panel-highlight: rgba(255, 255, 255, 0.88);
      --text-main: #10213f;
      --text-sub: #4c6088;
      --accent: #336af1;
      --accent-2: #6852f2;
      --dock-bg: rgba(255, 255, 255, 0.56);
      --menu-bg: rgba(255, 255, 255, 0.61);
      --input-bg: rgba(255, 255, 255, 0.44);
      --input-border: rgba(111, 141, 190, 0.31);
      --selection: rgba(50, 100, 240, 0.2);
      --grid: rgba(14,40,80,0.06);
      --shadow-lg: 0 24px 48px rgba(33, 74, 157, 0.23), 0 3px 10px rgba(45, 83, 164, 0.16);
      --shadow-md: 0 12px 28px rgba(35, 70, 139, 0.2), 0 2px 8px rgba(35, 70, 139, 0.16);
      --shadow-sm: 0 4px 10px rgba(38, 68, 123, 0.2);
    }

    * { box-sizing: border-box; user-select: none; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: var(--font-system); color: var(--text-main); }
    button, input, select, textarea { font: inherit; color: inherit; }

    #os {
      position: relative;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(1200px 600px at 14% 14%, color-mix(in oklab, var(--desktop-grad-a) 90%, #fff 10%), transparent 70%),
        radial-gradient(1200px 700px at 86% 88%, color-mix(in oklab, var(--desktop-grad-c) 90%, #fff 12%), transparent 72%),
        linear-gradient(150deg, var(--desktop-grad-a), var(--desktop-grad-b) 58%, var(--desktop-grad-c));
      background-attachment: fixed;
    }

    #desktopGrid {
      position: absolute; inset: 0;
      background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 26px 26px;
      opacity: 0.45;
      pointer-events: none;
    }

    .glass {
      background: linear-gradient(160deg, color-mix(in oklab, var(--panel-bg) 82%, #fff 18%), var(--panel-bg));
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-lg);
      backdrop-filter: blur(var(--blur-strength)) saturate(145%);
      -webkit-backdrop-filter: blur(var(--blur-strength)) saturate(145%);
      box-shadow: var(--shadow-md), inset 0 1px 0 var(--panel-highlight), inset 0 0 0 1px rgba(255,255,255,0.06), inset 0 0 60px rgba(255,255,255,var(--glow-strength));
    }

    #menubar {
      position: absolute; top: 8px; left: 10px; right: 10px; height: 34px;
      display: flex; align-items: center; justify-content: space-between; padding: 0 12px; z-index: 9000;
    }
    #menuLeft, #menuRight { display: flex; align-items: center; gap: 12px; font-size: 12.5px; }
    .menuStrong { font-weight: 600; }
    .menuIcon { width: 17px; height: 17px; opacity: 0.92; }

    #desktopArea { position: absolute; inset: 50px 0 96px 0; overflow: hidden; }

    .window {
      position: absolute;
      width: min(76vw, 960px);
      height: min(72vh, 640px);
      min-width: 360px;
      min-height: 260px;
      transform-origin: center;
      transition: transform var(--dur-med) var(--ease), opacity var(--dur-med) var(--ease), width var(--dur-med) var(--ease), height var(--dur-med) var(--ease), left var(--dur-med) var(--ease), top var(--dur-med) var(--ease);
      opacity: 0;
      pointer-events: none;
      will-change: transform, opacity;
      contain: layout paint;
    }
    .window.show { opacity: 1; transform: translateZ(0) scale(1); pointer-events: auto; }
    .window.hidden { opacity: 0; transform: scale(0.95); pointer-events: none; }

    .win-shell { width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
    .titlebar {
      height: 38px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 10px; border-bottom: 1px solid rgba(255,255,255,0.14); cursor: grab;
      background: linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0.04));
      flex: 0 0 38px;
    }
    .titlebar.dragging { cursor: grabbing; }
    .traffic { display: flex; gap: 8px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.25); }
    .dot.red { background: var(--danger); }
    .dot.yellow { background: var(--warn); }
    .dot.green { background: var(--ok); }
    .title { font-size: 12px; font-weight: 600; letter-spacing: 0.2px; }
    .win-body { flex: 1; min-height: 0; display: flex; overflow: hidden; }

    .sidebar { width: 170px; border-right: 1px solid rgba(255,255,255,0.14); padding: 10px; overflow: auto; }
    .content { flex: 1; min-width: 0; min-height: 0; overflow: auto; padding: 12px; }
    .section { margin-bottom: 12px; }
    .label { font-size: 11px; color: var(--text-sub); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }

    .list-item, .btn {
      width: 100%; border: 1px solid transparent; border-radius: 10px; padding: 7px 9px; background: transparent; color: inherit;
      text-align: left; transition: transform var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
    }
    .list-item:hover, .btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); }
    .list-item.active { background: var(--selection); border-color: color-mix(in oklab, var(--accent) 70%, #fff 30%); }

    .btn { cursor: pointer; }
    .btn.inline { width: auto; display: inline-flex; align-items: center; gap: 6px; }
    .row { display: flex; gap: 8px; align-items: center; }
    .grow { flex: 1; }

    input[type="text"], input[type="search"], input[type="number"], textarea, select {
      width: 100%; background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 10px; padding: 8px 10px;
      outline: none;
    }
    textarea { min-height: 140px; resize: vertical; }

    .dock-wrap {
      position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 9500;
      padding: 8px 10px;
    }
    #dock { display: flex; gap: 10px; align-items: flex-end; }
    .dock-item {
      width: 52px; height: 52px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.25);
      display: grid; place-items: center; cursor: pointer;
      background: linear-gradient(160deg, color-mix(in oklab, var(--dock-bg) 80%, #fff 20%), var(--dock-bg));
      box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,0.34);
      transform-origin: center bottom;
      transition: transform 80ms linear;
      will-change: transform;
    }
    .dock-item svg { width: 28px; height: 28px; }

    .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
    .tile {
      border: 1px solid rgba(255,255,255,0.14); border-radius: 12px; background: rgba(255,255,255,0.06); padding: 10px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .tile .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }

    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .day { min-height: 78px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.06); padding: 6px; font-size: 11px; }
    .day strong { display: block; margin-bottom: 4px; }

    .notification-center {
      position: absolute; top: 50px; right: 10px; width: min(350px, 90vw); bottom: 98px; z-index: 9200;
      transform: translateX(110%); transition: transform var(--dur-med) var(--ease);
      display: flex; flex-direction: column;
    }
    .notification-center.open { transform: translateX(0); }
    .notification-list { overflow: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .note-card { border-radius: 12px; border: 1px solid rgba(255,255,255,0.18); padding: 10px; background: rgba(255,255,255,0.08); }

    #contextMenu {
      position: absolute; z-index: 10000; min-width: 200px; padding: 6px; display: none;
    }
    .ctx-item { padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; }
    .ctx-item:hover { background: var(--selection); }

    .modal {
      position: absolute; inset: 0; display: none; place-items: center; background: rgba(0,0,0,0.36); z-index: 9800;
    }
    .modal.show { display: grid; }
    .modal-card { width: min(80vw, 920px); height: min(80vh, 760px); padding: 10px; }
    .modal-card img { width: 100%; height: 100%; object-fit: contain; border-radius: 12px; }

    .progress { height: 8px; border-radius: 99px; background: rgba(255,255,255,0.15); overflow: hidden; }
    .bar { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }

    .terminal { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.4; }
    .terminal-output { height: calc(100% - 40px); overflow: auto; white-space: pre-wrap; }
    .terminal-input { width: 100%; border: none; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 8px; }

    @media (max-width: 860px) {
      .sidebar { width: 130px; }
      .window { min-width: 300px; }
      .dock-item { width: 44px; height: 44px; }
    }
  </style>
</head>
<body>
  <div id="os">
    <div id="desktopGrid"></div>

    <div id="menubar" class="glass" style="background: var(--menu-bg); border-radius: 12px;">
      <div id="menuLeft">
        <span class="menuStrong"></span>
        <span class="menuStrong">Liquid macOS</span>
        <span>File</span><span>Edit</span><span>View</span><span>Window</span><span>Help</span>
      </div>
      <div id="menuRight">
        <svg class="menuIcon" viewBox="0 0 24 24" fill="none" aria-label="WiFi"><path d="M2.5 9.7A15.8 15.8 0 0 1 12 6.5c3.6 0 7 1.2 9.5 3.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M5.5 13.2A11 11 0 0 1 12 11c2.5 0 4.8.8 6.5 2.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M8.8 16.6a6.2 6.2 0 0 1 6.4 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="19.2" r="1.2" fill="currentColor"/></svg>
        <svg class="menuIcon" viewBox="0 0 28 14" fill="none" aria-label="Battery"><rect x="1" y="1" width="23" height="12" rx="3" stroke="currentColor"/><rect x="25" y="4" width="2" height="6" rx="1" fill="currentColor"/><rect x="3" y="3" width="16" height="8" rx="2" fill="currentColor"/></svg>
        <span id="clock">--:--:--</span>
        <button id="toggleNc" class="btn inline">Notifications</button>
      </div>
    </div>

    <div id="desktopArea"></div>

    <aside id="notificationCenter" class="notification-center glass">
      <div class="row" style="padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,.16)">
        <strong class="grow">Notification Center</strong>
        <button id="clearNotifications" class="btn inline">Clear</button>
      </div>
      <div id="notificationList" class="notification-list"></div>
    </aside>

    <div class="dock-wrap glass" style="background: var(--dock-bg);">
      <div id="dock"></div>
    </div>

    <div id="contextMenu" class="glass"></div>

    <div id="photoModal" class="modal">
      <div class="modal-card glass"><img id="photoModalImg" alt="Preview" /></div>
    </div>
  </div>

  <script>
    /*
      ==========================================================================================
      LIQUID MACOS SIMULATION
      ------------------------------------------------------------------------------------------
      This file intentionally contains very detailed comments and architecture-oriented sections.
      The design goal is to provide a clean modular structure while keeping all logic in one file,
      fully offline, with no external dependencies.
      ==========================================================================================
    */

    // ------------------------------------------------------------------------------------------------
    // Utilities
    // ------------------------------------------------------------------------------------------------
    const $ = (s, root = document) => root.querySelector(s);
    const $$ = (s, root = document) => Array.from(root.querySelectorAll(s));
    const uid = () => Math.random().toString(36).slice(2, 10);
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

    const Storage = {
      key: 'liquid_macos_state_v1',
      load() {
        try { return JSON.parse(localStorage.getItem(this.key) || '{}'); } catch { return {}; }
      },
      save(state) { localStorage.setItem(this.key, JSON.stringify(state)); }
    };

    const defaultState = {
      system: { theme: 'dark', blur: 24, glow: 0.33, wallpaper: 0 },
      finder: { items: [{ id: uid(), name: 'Projects', type: 'folder' }, { id: uid(), name: 'Ideas.txt', type: 'file' }] },
      notes: { notes: [{ id: uid(), title: 'Welcome', content: 'Liquid Glass Notes ready.', updated: Date.now() }], active: null },
      calendar: { events: {} },
      reminders: { items: [] },
      safari: { code: '<h1>Hello Liquid Safari</h1><p>Type HTML and render locally.</p>', preset: 'welcome' },
      mail: { inbox: [{ id: uid(), from: 'team@local', subj: 'Welcome', body: 'Your offline inbox is active.' }], drafts: { to: '', subj: '', body: '' } },
      photos: { items: [] },
      terminal: { history: ['Liquid Terminal ready. Type help'] },
      settings: {},
      activity: { samples: [] }
    };

    const state = Object.assign({}, defaultState, Storage.load());

    // ------------------------------------------------------------------------------------------------
    // Notification Center service
    // ------------------------------------------------------------------------------------------------
    const Notifications = {
      listEl: $('#notificationList'),
      push(title, body = '') {
        const card = document.createElement('div');
        card.className = 'note-card';
        card.innerHTML = `<strong>${title}</strong><div style="font-size:12px; color:var(--text-sub)">${body}</div>`;
        this.listEl.prepend(card);
        setTimeout(() => card.remove(), 6000);
      },
      clear() { this.listEl.innerHTML = ''; }
    };

    // ------------------------------------------------------------------------------------------------
    // Theme + visual controls
    // ------------------------------------------------------------------------------------------------
    function applyTheme(theme) {
      document.documentElement.classList.toggle('light', theme === 'light');
      state.system.theme = theme;
      persist();
      Notifications.push('Theme changed', `Now using ${theme} liquid glass theme.`);
    }
    function applyVisualPrefs() {
      document.documentElement.style.setProperty('--blur-strength', `${state.system.blur}px`);
      document.documentElement.style.setProperty('--glow-strength', `${state.system.glow}`);
    }

    // ------------------------------------------------------------------------------------------------
    // Window manager
    // ------------------------------------------------------------------------------------------------
    const WM = {
      z: 100,
      windows: new Map(),
      bring(win) {
        this.z += 1;
        win.style.zIndex = this.z;
      },
      create(appId, title, renderFn, size = {}) {
        let win = this.windows.get(appId);
        if (win) { this.show(appId); return win; }

        win = document.createElement('section');
        win.className = 'window glass';
        win.dataset.app = appId;
        const left = size.left ?? Math.round(window.innerWidth * 0.12 + Math.random() * 60);
        const top = size.top ?? Math.round(window.innerHeight * 0.12 + Math.random() * 40);
        win.style.left = `${left}px`; win.style.top = `${top}px`;
        if (size.w) win.style.width = size.w + 'px';
        if (size.h) win.style.height = size.h + 'px';
        win.innerHTML = `
          <div class="win-shell">
            <div class="titlebar">
              <div class="traffic">
                <button class="dot red" data-act="close" aria-label="Close"></button>
                <button class="dot yellow" data-act="min" aria-label="Minimize"></button>
                <button class="dot green" data-act="max" aria-label="Maximize"></button>
              </div>
              <div class="title">${title}</div>
              <div style="width:52px"></div>
            </div>
            <div class="win-body"></div>
          </div>
        `;

        const body = $('.win-body', win);
        renderFn(body, win);
        $('#desktopArea').appendChild(win);

        // traffic-light behavior
        win.addEventListener('click', () => this.bring(win));
        $$('[data-act]', win).forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const act = btn.dataset.act;
            if (act === 'close') this.hide(appId);
            if (act === 'min') this.minimize(win);
            if (act === 'max') this.toggleMax(win);
          });
        });

        // drag + snapping
        setupDrag(win);

        this.windows.set(appId, win);
        requestAnimationFrame(() => win.classList.add('show'));
        this.bring(win);
        return win;
      },
      show(appId) {
        const win = this.windows.get(appId);
        if (!win) return;
        win.classList.remove('hidden');
        win.classList.add('show');
        this.bring(win);
      },
      hide(appId) {
        const win = this.windows.get(appId);
        if (!win) return;
        win.classList.add('hidden');
        Notifications.push('Window hidden', `${appId} minimized/closed.`);
      },
      minimize(win) {
        win.classList.add('hidden');
      },
      toggleMax(win) {
        if (win.dataset.max === '1') {
          win.style.left = win.dataset.prevLeft;
          win.style.top = win.dataset.prevTop;
          win.style.width = win.dataset.prevW;
          win.style.height = win.dataset.prevH;
          win.dataset.max = '0';
        } else {
          win.dataset.prevLeft = win.style.left;
          win.dataset.prevTop = win.style.top;
          win.dataset.prevW = win.style.width;
          win.dataset.prevH = win.style.height;
          win.style.left = '10px';
          win.style.top = '52px';
          win.style.width = (window.innerWidth - 20) + 'px';
          win.style.height = (window.innerHeight - 160) + 'px';
          win.dataset.max = '1';
        }
      }
    };

    function setupDrag(win) {
      const bar = $('.titlebar', win);
      let drag = null;
      bar.addEventListener('pointerdown', (e) => {
        if (e.target.matches('[data-act]')) return;
        bar.classList.add('dragging');
        WM.bring(win);
        drag = { x: e.clientX, y: e.clientY, left: parseFloat(win.style.left), top: parseFloat(win.style.top) };
        bar.setPointerCapture(e.pointerId);
      });
      bar.addEventListener('pointermove', (e) => {
        if (!drag) return;
        const nx = drag.left + (e.clientX - drag.x);
        const ny = drag.top + (e.clientY - drag.y);
        win.style.left = nx + 'px';
        win.style.top = ny + 'px';
      });
      bar.addEventListener('pointerup', () => {
        bar.classList.remove('dragging');
        if (!drag) return;
        const rect = win.getBoundingClientRect();
        const edge = 26;
        if (rect.left < edge) {
          win.style.left = '0px'; win.style.top = '52px'; win.style.width = (window.innerWidth / 2) + 'px'; win.style.height = (window.innerHeight - 148) + 'px';
        } else if (window.innerWidth - rect.right < edge) {
          win.style.left = (window.innerWidth / 2) + 'px'; win.style.top = '52px'; win.style.width = (window.innerWidth / 2) + 'px'; win.style.height = (window.innerHeight - 148) + 'px';
        } else if (rect.top < 60) {
          win.style.left = '10px'; win.style.top = '52px'; win.style.width = (window.innerWidth - 20) + 'px'; win.style.height = (window.innerHeight - 160) + 'px';
        }
        drag = null;
      });
    }

    // ------------------------------------------------------------------------------------------------
    // App registry + dock
    // ------------------------------------------------------------------------------------------------
    const apps = [
      { id: 'finder', name: 'Finder', icon: iconFolder, open: openFinder },
      { id: 'notes', name: 'Notes', icon: iconNotes, open: openNotes },
      { id: 'calendar', name: 'Calendar', icon: iconCalendar, open: openCalendar },
      { id: 'reminders', name: 'Reminders', icon: iconReminders, open: openReminders },
      { id: 'safari', name: 'Safari', icon: iconSafari, open: openSafari },
      { id: 'mail', name: 'Mail', icon: iconMail, open: openMail },
      { id: 'music', name: 'Music', icon: iconMusic, open: openMusic },
      { id: 'photos', name: 'Photos', icon: iconPhotos, open: openPhotos },
      { id: 'terminal', name: 'Terminal', icon: iconTerminal, open: openTerminal },
      { id: 'settings', name: 'System Settings', icon: iconSettings, open: openSettings },
      { id: 'calculator', name: 'Calculator', icon: iconCalc, open: openCalculator },
      { id: 'activity', name: 'Activity Monitor', icon: iconActivity, open: openActivity }
    ];

    function initDock() {
      const dock = $('#dock');
      dock.innerHTML = '';
      apps.forEach(app => {
        const item = document.createElement('button');
        item.className = 'dock-item';
        item.title = app.name;
        item.dataset.app = app.id;
        item.innerHTML = app.icon();
        item.addEventListener('click', () => app.open());
        dock.appendChild(item);
      });

      dock.addEventListener('mousemove', (e) => {
        const items = $$('.dock-item', dock);
        const mouseX = e.clientX;
        items.forEach(i => {
          const r = i.getBoundingClientRect();
          const d = Math.abs(mouseX - (r.left + r.width / 2));
          const scale = 1 + clamp((90 - d) / 90, 0, 1) * 0.7;
          i.style.transform = `translateZ(0) scale(${scale})`;
        });
      });
      dock.addEventListener('mouseleave', () => $$('.dock-item', dock).forEach(i => i.style.transform = 'scale(1)'));
    }

    // ------------------------------------------------------------------------------------------------
    // App implementations
    // ------------------------------------------------------------------------------------------------

    function openNotes() {
      WM.create('notes', 'Notes', (body) => {
        body.innerHTML = `
          <aside class="sidebar">
            <div class="row"><input type="search" id="nSearch" placeholder="Search"/></div>
            <div class="section"><button id="nAdd" class="btn">New Note</button></div>
            <div id="nList"></div>
          </aside>

            <input type="text" id="nTitle" placeholder="Title" style="margin-bottom:8px"/>

          </main>
        `;
        const list = $('#nList', body), title = $('#nTitle', body), content = $('#nContent', body), search = $('#nSearch', body);
        const ensureActive = () => {
          if (!state.notes.active && state.notes.notes.length) state.notes.active = state.notes.notes[0].id;
        };
        const render = () => {
          ensureActive();
          const q = search.value.toLowerCase();
          list.innerHTML = '';
          state.notes.notes.filter(n => n.title.toLowerCase().includes(q) || n.content.toLowerCase().includes(q)).forEach(n => {
            const b = document.createElement('button'); b.className = 'list-item' + (n.id === state.notes.active ? ' active' : ''); b.textContent = n.title || 'Untitled';
            b.onclick = () => { state.notes.active = n.id; renderEditor(); render(); persist(); };
            list.appendChild(b);
          });
          renderEditor();
        };
        const renderEditor = () => {
          const n = state.notes.notes.find(x => x.id === state.notes.active);
          if (!n) { title.value = ''; content.value = ''; return; }
          title.value = n.title; content.value = n.content;
        };
        const save = () => {
          const n = state.notes.notes.find(x => x.id === state.notes.active); if (!n) return;
          n.title = title.value || 'Untitled'; n.content = content.value; n.updated = Date.now(); persist();
        };
        $('#nAdd', body).onclick = () => { const n = { id: uid(), title: 'New Note', content: '', updated: Date.now() }; state.notes.notes.unshift(n); state.notes.active = n.id; persist(); render(); };
        title.oninput = save; content.oninput = save; search.oninput = render;
        render();
      }, { w: 820, h: 560 });

    function openTerminal() {
      WM.create('terminal', 'Terminal', (body) => {
        body.innerHTML = `<main class="content terminal"><div id="tOut" class="terminal-output"></div><input id="tIn" class="terminal-input" placeholder="command"/></main>`;
        const out = $('#tOut', body), input = $('#tIn', body);
        const print = (txt) => { state.terminal.history.push(txt); out.textContent = state.terminal.history.join('\n'); out.scrollTop = out.scrollHeight; persist(); };
        out.textContent = state.terminal.history.join('\n');
        input.addEventListener('keydown', (e) => {
          if (e.key !== 'Enter') return;
          const v = input.value.trim(); input.value='';
          print(`$ ${v}`);
          const [cmd, ...args] = v.split(' ');
          if (cmd === 'help') print('help clear date echo theme');
          else if (cmd === 'clear') { state.terminal.history = []; out.textContent = ''; persist(); }
          else if (cmd === 'date') print(new Date().toString());
          else if (cmd === 'echo') print(args.join(' '));
          else if (cmd === 'theme') { applyTheme(args[0] === 'light' ? 'light' : 'dark'); print('theme changed'); }
          else print('command not found');
        });
      }, { w: 680, h: 430 });
    }

    // Calculator worker
    const calcWorker = new Worker(URL.createObjectURL(new Blob([`
      onmessage = (e) => {
        const expr = e.data;
        try {
          if (!/^[0-9+\-*/(). %]+$/.test(expr)) throw new Error('invalid');
          const result = Function('return (' + expr + ')')();
          postMessage({ ok: true, result: String(result) });
        } catch {
          postMessage({ ok: false, result: 'Error' });
        }
      };
    `], { type: 'application/javascript' })));

    // Activity worker
    const activityWorker = new Worker(URL.createObjectURL(new Blob([`
      function randomWalk(v, step, min, max) {
        v += (Math.random() - 0.5) * step;
        if (v < min) v = min + Math.random() * step;
        if (v > max) v = max - Math.random() * step;
        return v;
      }
      let cpu = 42, mem = 58;
      setInterval(() => {
        cpu = randomWalk(cpu, 18, 6, 98);
        mem = randomWalk(mem, 8, 14, 96);
        postMessage({ cpu: +cpu.toFixed(1), mem: +mem.toFixed(1) });
      }, 700);
    `], { type: 'application/javascript' })));

    // ------------------------------------------------------------------------------------------------
    // Global context menu
    // ------------------------------------------------------------------------------------------------
    const ctx = $('#contextMenu');
    function showContext(x, y, actions) {
      ctx.innerHTML = actions.map(a => `<div class="ctx-item" data-id="${a.id}">${a.label}</div>`).join('');
      ctx.style.display = 'block';
      ctx.style.left = Math.min(x, window.innerWidth - 220) + 'px';
      ctx.style.top = Math.min(y, window.innerHeight - 240) + 'px';
      ctx.onclick = (e) => {
        const id = e.target.closest('.ctx-item')?.dataset.id;
        const act = actions.find(a => a.id === id);
        if (act) act.run();
        ctx.style.display = 'none';
      };
    }

    document.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      const inFinder = e.target.closest('[data-app="finder"]');
      const inNotes = e.target.closest('[data-app="notes"]');
      if (inFinder) {
        showContext(e.clientX, e.clientY, [
          { id: 'newf', label: 'New Folder', run: () => { state.finder.items.push({ id: uid(), name: 'New Folder', type: 'folder' }); persist(); openFinder(); } },
          { id: 'newfile', label: 'New File', run: () => { state.finder.items.push({ id: uid(), name: 'New File.txt', type: 'file' }); persist(); openFinder(); } }
        ]);
      } else if (inNotes) {
        showContext(e.clientX, e.clientY, [
          { id: 'copy', label: 'Copy', run: () => document.execCommand('copy') },
          { id: 'paste', label: 'Paste', run: () => document.execCommand('paste') }
        ]);
      } else {
        showContext(e.clientX, e.clientY, [
          { id: 'deskfolder', label: 'New Folder', run: () => { state.finder.items.push({ id: uid(), name: 'Desktop Folder', type: 'folder' }); persist(); Notifications.push('Desktop', 'Folder created in Finder.'); } },
          { id: 'wall', label: 'Change Wallpaper', run: () => { state.system.wallpaper = (state.system.wallpaper + 1) % 3; cycleWallpaper(); persist(); } }
        ]);
      }
    });

    document.addEventListener('click', () => { ctx.style.display = 'none'; });

    function cycleWallpaper() {
      const idx = state.system.wallpaper;
      const sets = [
        ['#2b355f', '#101527', '#3d2069'],
        ['#0d3d5c', '#081522', '#21573c'],
        ['#5a2b54', '#1a1428', '#263466']
      ][idx];
      document.documentElement.style.setProperty('--desktop-grad-a', sets[0]);
      document.documentElement.style.setProperty('--desktop-grad-b', sets[1]);
      document.documentElement.style.setProperty('--desktop-grad-c', sets[2]);
    }

    // ------------------------------------------------------------------------------------------------
    // Boot sequence and system services
    // ------------------------------------------------------------------------------------------------
    function persist(){ Storage.save(state); }

    function boot() {
      applyTheme(state.system.theme || 'dark');
      applyVisualPrefs();
      cycleWallpaper();
      initDock();
      tickClock();
      setInterval(tickClock, 1000);
      $('#toggleNc').onclick = () => $('#notificationCenter').classList.toggle('open');
      $('#clearNotifications').onclick = () => Notifications.clear();
      $('#photoModal').onclick = () => $('#photoModal').classList.remove('show');
      Notifications.push('System ready', 'Liquid macOS initialized offline.');
      openFinder();
    }

    function tickClock() {
      $('#clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    boot();

    // ------------------------------------------------------------------------------------------------
    // Extended comments for architecture traces and maintainability docs.
